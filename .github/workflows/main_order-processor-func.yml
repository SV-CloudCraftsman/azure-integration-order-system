name: Build and deploy dotnet core app to Azure Function App - order-processor-func

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # 🔥 KEY FIX: Use .csproj directly (not .sln)
      - name: Restore Dependencies
        run: dotnet restore OrderProcessor.Function.csproj

      - name: Publish Project
        run: dotnet publish OrderProcessor.Function.csproj --configuration Release --output ./output

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: 'order-processor-func'
          slot-name: 'Production'
          package: './output'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_6ED80B25F8784AB397219D57705023D9 }}
